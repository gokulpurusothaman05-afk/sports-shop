<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackly</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/webp" href="assets/images/logo.webp">
</head>
<body>

  <div class="top-bar">
    <span><img src="assets/images/logo.webp" alt="Stackly" style="height: 14px; width: auto; vertical-align: -2px; margin-right: 6px; display: inline-block;"> REGISTER TODAY & RECEIVE A ₹500 WELCOME DISCOUNT VOUCHER</span>
  </div>

  <header class="site-header">
    <div class="container-wide nav-wrapper">
      <a href="index.html" class="brand-logo"><img src="assets/images/logo.webp" alt="Stackly" class="brand-logo-img"><span>Stackly</span></a>
      <nav class="main-nav">
        <a href="cricket.html" class="nav-link">Cricket</a>
        <a href="badminton.html" class="nav-link">Badminton</a>
        <a href="running.html" class="nav-link">Running</a>
        <a href="gym.html" class="nav-link">Gym & Fitness</a>
        <a href="football.html" class="nav-link">Football</a>
        <a href="new-in.html" class="nav-link">New In</a>
      </nav>
      <div>
        <a href="login.html" class="action-btn-sm" style="border-radius: var(--radius-full); padding: 8px 18px;">Already Member? Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-page-container">
    <div class="auth-card-wrap" style="max-width: 560px;">
      
      <div class="auth-header">
        <a href="index.html" class="auth-logo"><img src="assets/images/logo.webp" alt="Stackly" class="brand-logo-img"><span>Stackly</span></a>
        <h1 class="auth-title">CREATE YOUR ACCOUNT</h1>
        <p class="auth-sub">Join India's most dedicated athletic community</p>
      </div>

      <form class="auth-form" id="signup-form">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <div class="form-input-wrap">
            <svg class="form-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="signup-name" placeholder="e.g. Ananya Sharma" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Email Address *</label>
            <div class="form-input-wrap">
              <svg class="form-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="signup-email" placeholder="name@example.com" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Mobile (+91) *</label>
            <div class="form-input-wrap">
              <svg class="form-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <input type="tel" id="signup-phone" placeholder="9876543210" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">City / Home Location (India)</label>
          <div class="form-input-wrap">
            <svg class="form-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <input type="text" id="signup-city" placeholder="e.g. Bengaluru / Mumbai / Delhi">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Password *</label>
            <div class="form-input-wrap">
              <svg class="form-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="signup-password" placeholder="At least 6 characters" minlength="6" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password *</label>
            <div class="form-input-wrap">
              <svg class="form-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="signup-confirm-password" placeholder="Repeat password (min 6 chars)" minlength="6" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Primary Sports of Interest</label>
          <div style="display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">
            <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox" checked> Cricket</label>
            <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox" checked> Badminton</label>
            <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox" checked> Running</label>
            <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox"> Gym / Fitness</label>
            <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox"> Football</label>
          </div>
        </div>

        <div class="form-options-row">
          <label class="checkbox-label" style="font-size: 0.82rem;">
            <input type="checkbox" required checked>
            <span>I agree to Stackly terms & conditions & privacy policy</span>
          </label>
        </div>

        <button type="submit" class="auth-submit-btn" style="background: var(--gradient-brand);">
          <span>Create My Account</span>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="auth-footer-prompt">
        Already have an account? <a href="login.html">Sign In Here</a>
      </div>

    </div>
  </main>

  <div class="toast-container"></div>

  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
